<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>You already have a {{companyName}} account</title>
		<link rel="stylesheet" href="https://assets.3sixty.global/email/style.css" type="text/css" />
	</head>
	<body>
		<div class="logo" role="img" aria-label="{{companyName}}"></div>
		<p>
			Someone tried to sign up to {{companyName}} with this e-mail address, but it already has an
			account.
		</p>
		<p>
			If this was you, sign in with your existing account, or reset your password if you have
			forgotten it. If it was not you, you can ignore this e-mail.
		</p>
		<p>{{companyName}}</p>
	</body>
</html>
