<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Reset your {{companyName}} password</title>
		<link rel="stylesheet" href="https://assets.3sixty.global/email/style.css" type="text/css" />
	</head>
	<body>
		<div class="logo" role="img" aria-label="{{companyName}}"></div>
		<p>We received a request to reset the password for your {{companyName}} account.</p>
		<p><a href="{{resetUrl}}">Reset your password</a></p>
		<p>
			This link can be used once and expires in {{expiryMinutes}} minutes, at {{expires}}. If you
			did not ask to reset your password you can ignore this e-mail.
		</p>
		<p>{{companyName}}</p>
	</body>
</html>
