<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Verify your e-mail address for {{companyName}}</title>
		<link rel="stylesheet" href="https://assets.3sixty.global/email/style.css" type="text/css" />
	</head>
	<body>
		<div class="logo" role="img" aria-label="{{companyName}}"></div>
		<p>
			Thank you for signing up to {{companyName}}. Please verify your e-mail address to finish
			creating your account.
		</p>
		<p><a href="{{verifyUrl}}">Verify your e-mail address</a></p>
		<p>
			This link can be used once and expires in {{expiryMinutes}} minutes, at {{expires}}. If you
			did not sign up you can ignore this e-mail.
		</p>
		<p>{{companyName}}</p>
	</body>
</html>
