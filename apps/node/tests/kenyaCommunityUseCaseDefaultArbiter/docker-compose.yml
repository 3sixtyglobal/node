services:
  twin-kenya-defaultarb-node:
    build:
      # Context is the twin-node repo root — the image consumes only the published npm
      # packages in twin-node/node_modules, so no cross-submodule paths are needed.
      context: ../../../..
      dockerfile: apps/node/tests/kenyaCommunityUseCaseDefaultArbiter/Dockerfile
    container_name: twin-kenya-defaultarb-node
    ports:
      - '3042:3000'
    env_file:
      - env/node.env
    volumes:
      - kenya-defaultarb-data:/app/data
    networks:
      - twin-kenya-defaultarb-network

volumes:
  kenya-defaultarb-data:

networks:
  twin-kenya-defaultarb-network:
    driver: bridge
