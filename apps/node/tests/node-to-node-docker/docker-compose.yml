services:
  twin-blob-ipfs:
    image: ipfs/kubo:v0.40.1
    container_name: twin-blob-ipfs-docker
    ports:
      - '5001:5001'
      - '4001:4001'
      - '8080:8080'
    volumes:
      - ipfs-data:/data/ipfs
    networks:
      - twin-network

  twin-node-a:
    build:
      context: ../../../../..
      dockerfile: node/apps/node/tests/node-to-node-docker/Dockerfile
    container_name: twin-node-a
    ports:
      - '3000:3000'
    env_file:
      - env/node-a-docker.env
    volumes:
      - node-a-data:/app/data
    depends_on:
      twin-blob-ipfs:
        condition: service_started
    networks:
      - twin-network

  twin-node-b:
    build:
      context: ../../../../..
      dockerfile: node/apps/node/tests/node-to-node-docker/Dockerfile
    container_name: twin-node-b
    ports:
      - '3001:3001'
    env_file:
      - env/node-b-docker.env
    volumes:
      - node-b-data:/app/data
    depends_on:
      twin-node-a:
        condition: service_started
    networks:
      - twin-network

volumes:
  ipfs-data:
  node-a-data:
  node-b-data:

networks:
  twin-network:
    driver: bridge
