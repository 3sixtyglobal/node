global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: twin-node
    static_configs:
      # host.docker.internal resolves to the Docker host on macOS and Windows.
      # On Linux add extra_hosts: host.docker.internal:host-gateway to the
      # prometheus service in docker-compose.yml (already done).
      - targets:
          - host.docker.internal:9464
    relabel_configs:
      - target_label: instance
        replacement: twin-node
