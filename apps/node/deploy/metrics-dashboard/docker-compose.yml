name: twin-node-metrics

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: twin-node-prometheus
    ports:
      - '9090:9090'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    # Needed on Linux so host.docker.internal resolves to the Docker host.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: twin-node-grafana
    ports:
      # Port 4000 avoids conflict with the twin-node REST server on :3000.
      - '4000:3000'
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - ./provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  grafana-data:
