name: Docker Publish

on:
  workflow_dispatch:
    inputs:
      # Which branch are we publishing the image from?
      releaseType:
        description: 'Branch to publish the image from'
        required: true
        type: choice
        options:
          - '🚧 prerelease (next branch)' # For prereleases (e.g., 0.1.0-next.1)
          - '🚀 production (main branch)' # For production releases (e.g., 1.0.0, 1.1.0, 1.1.1)

env:
  TWIN_DOCKER_USERNAME: ${{ secrets.TWIN_DOCKER_USERNAME }}
  TWIN_DOCKER_REPO: twinfoundation/twin-node

jobs:
  build-and-push:
    runs-on:
      labels: ${{ github.event.repository.private && 'self-hosted' || 'ubuntu-latest' }}
      group: ${{ github.event.repository.private && 'twin' || 'default' }}
    steps:
      # Set branch variable based on release type
      - name: Set target branch
        id: set-branch
        run: |
          INPUT="${{ github.event.inputs.releaseType }}"
          if [[ "$INPUT" == *"next"* ]]; then
            BRANCH="next"
          elif [[ "$INPUT" == *"main"* ]]; then
            BRANCH="main"
          else
            echo "Error: Unrecognized release type: $INPUT"
            exit 1
          fi
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "Using branch: $BRANCH"

      # Clone the repository to the runner
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }} # Use the built-in token for GitHub Actions
          ref: ${{ steps.set-branch.outputs.branch }} # Checkout the calculated branch

      # Setup Node
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      # Extract version from node-core/package.json so we can use in the tags
      - name: Extract version from node-core/package.json
        id: package-version
        run: |
          VERSION=$(cat packages/node-core/package.json | jq -r '.version')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      # Determine Docker tags based on branch and version
      - name: Determine Docker tags
        id: docker-tags
        run: |
          VERSION_TAG="${{ env.TWIN_DOCKER_REPO }}:${{ steps.package-version.outputs.version }}"
          BRANCH="${{ steps.set-branch.outputs.branch }}"

          if [[ "$BRANCH" == "main" ]]; then
            TAGS="$VERSION_TAG,${{ env.TWIN_DOCKER_REPO }}:latest"
            echo "Building from main branch - adding latest tag"
          else
            TAGS="$VERSION_TAG,${{ env.TWIN_DOCKER_REPO }}:next"
            echo "Building from next branch - adding next tag"
          fi

          echo "tags=$TAGS" >> $GITHUB_OUTPUT
          echo "Docker tags: $TAGS"

      # Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ env.TWIN_DOCKER_USERNAME }}
          password: ${{ secrets.TWIN_DOCKER_PASSWORD }}

      # Build and push the Docker image
      - name: Build and Push Docker image
        id: build-push
        uses: docker/build-push-action@v7
        with:
          context: ./apps/node
          file: ./apps/node/deploy/dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker-tags.outputs.tags }}

      # Output publish summary
      - name: Publish Summary
        run: |
          VERSION="${{ steps.package-version.outputs.version }}"
          BRANCH="${{ steps.set-branch.outputs.branch }}"
          REPO="${{ env.TWIN_DOCKER_REPO }}"
          DIGEST="${{ steps.build-push.outputs.digest }}"

          if [[ "$BRANCH" == "main" ]]; then
            CHANNEL_TAG="latest"
          else
            CHANNEL_TAG="next"
          fi

          echo "## Docker Publish Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Version** | \`$VERSION\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`$BRANCH\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Channel tag** | \`$CHANNEL_TAG\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Image digest** | \`$DIGEST\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Tags published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- [\`$REPO:$VERSION\`](https://hub.docker.com/r/$REPO/tags?name=$VERSION)" >> $GITHUB_STEP_SUMMARY
          echo "- [\`$REPO:$CHANNEL_TAG\`](https://hub.docker.com/r/$REPO/tags?name=$CHANNEL_TAG)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Repository" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- [Docker Hub: $REPO](https://hub.docker.com/r/$REPO)" >> $GITHUB_STEP_SUMMARY
