name: Docker Publish

on:
  workflow_dispatch:
    inputs:
      # Which branch are we publishing the image from?
      releaseType:
        description: 'Branch to publish the image from'
        required: true
        type: choice
        options:
          - '🌱 prerelease (next branch)' # For prereleases (e.g., 0.1.0-next.1)
          - '🌳 production (main branch)' # For production releases (e.g., 1.0.0, 1.1.0, 1.1.1)

concurrency:
  group: twin-node-docker-publish
  cancel-in-progress: false

env:
  TWIN_REGISTRY: ghcr.io
  TWIN_IMAGE_NAME: twin-node

jobs:
  build-and-push:
    runs-on: ${{ github.event.repository.private && fromJSON('{"group":"twin","labels":"self-hosted"}') || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write

    steps:
      # Set branch variable based on release type
      - name: Set target branch
        id: set-branch
        run: |
          INPUT="${{ github.event.inputs.releaseType }}"
          if [[ "$INPUT" == *"next"* ]]; then
            BRANCH="next"
          elif [[ "$INPUT" == *"main"* ]]; then
            BRANCH="main"
          else
            echo "Error: Unrecognized release type: $INPUT"
            exit 1
          fi
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "Using branch: $BRANCH"

      # Clone the repository to the runner
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }} # Use the built-in token for GitHub Actions
          ref: ${{ steps.set-branch.outputs.branch }} # Checkout the calculated branch

      # Setup Node
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      # Extract version from node-core/package.json so we can use in the tags
      - name: Extract version from node-core/package.json
        id: package-version
        run: |
          VERSION=$(cat packages/node-core/package.json | jq -r '.version')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      # Determine Docker tags based on branch and version
      - name: Determine Docker tags
        id: docker-tags
        run: |
          # GHCR requires lowercase image names
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          REPO="${{ env.TWIN_REGISTRY }}/$OWNER/${{ env.TWIN_IMAGE_NAME }}"
          VERSION_TAG="$REPO:${{ steps.package-version.outputs.version }}"
          BRANCH="${{ steps.set-branch.outputs.branch }}"

          if [[ "$BRANCH" == "main" ]]; then
            TAGS="$VERSION_TAG,$REPO:latest"
            echo "Building from main branch - adding latest tag"
          else
            TAGS="$VERSION_TAG,$REPO:next"
            echo "Building from next branch - adding next tag"
          fi

          echo "repo=$REPO" >> "$GITHUB_OUTPUT"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "Docker tags: $TAGS"

      # Log in to GitHub Container Registry
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.TWIN_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Check whether the version tag already exists in GitHub Container Registry
      - name: Check existing GHCR version tag
        id: check-existing-tag
        run: |
          IMAGE="${{ steps.docker-tags.outputs.repo }}:${{ steps.package-version.outputs.version }}"

          if OUTPUT=$(docker manifest inspect "$IMAGE" 2>&1); then
            echo "version_exists=true" >> $GITHUB_OUTPUT
            echo "Version tag already exists: $IMAGE"
          elif echo "$OUTPUT" | grep -qiE "manifest unknown|no such manifest|not found"; then
            echo "version_exists=false" >> $GITHUB_OUTPUT
            echo "Version tag does not exist yet: $IMAGE"
          else
            echo "Error: GHCR tag check failed for $IMAGE"
            echo "$OUTPUT"
            exit 1
          fi

      # Set up Docker Buildx
      - name: Set up Docker Buildx
        if: steps.check-existing-tag.outputs.version_exists != 'true'
        uses: docker/setup-buildx-action@v4

      # Build and push the Docker image
      - name: Build and Push Docker image
        id: build-push
        if: steps.check-existing-tag.outputs.version_exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./apps/node
          file: ./apps/node/deploy/dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker-tags.outputs.tags }}
          # Links the package to this repository in GitHub Packages
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      # Output publish summary
      - name: Publish Summary
        run: |
          VERSION="${{ steps.package-version.outputs.version }}"
          BRANCH="${{ steps.set-branch.outputs.branch }}"
          IMAGE_NAME="${{ env.TWIN_IMAGE_NAME }}"
          IMAGE_REPO="${{ steps.docker-tags.outputs.repo }}"
          PACKAGE_URL="${{ github.server_url }}/${{ github.repository }}/pkgs/container/$IMAGE_NAME"
          VERSION_EXISTS="${{ steps.check-existing-tag.outputs.version_exists }}"

          if [[ "$VERSION_EXISTS" == "true" ]]; then
            PUBLISH_STATUS="skipped (version already exists)"
            DIGEST="N/A"
          else
            PUBLISH_STATUS="published"
            DIGEST="${{ steps.build-push.outputs.digest }}"
          fi

          if [[ "$BRANCH" == "main" ]]; then
            CHANNEL_TAG="latest"
          else
            CHANNEL_TAG="next"
          fi

          echo "## Docker Publish Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Version** | \`$VERSION\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`$BRANCH\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Channel tag** | \`$CHANNEL_TAG\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Publish status** | $PUBLISH_STATUS |" >> $GITHUB_STEP_SUMMARY
          echo "| **Image digest** | \`$DIGEST\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Tags published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- \`$IMAGE_REPO:$VERSION\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`$IMAGE_REPO:$CHANNEL_TAG\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Package" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- [GitHub Packages: $IMAGE_NAME]($PACKAGE_URL)" >> $GITHUB_STEP_SUMMARY
